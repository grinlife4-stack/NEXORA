name: Import NEXORA 0.5.4 source from verified TRADIX artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Retrieve exact artifact from the non-production branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/tradix-transfer-test:refs/remotes/origin/tradix-transfer-test
          EXPECTED_SHA256='83b2b5fc464a5df1b5f1f8ef74b187962efdae0591a82ea28690a09eaa0a1f8e'
          OBJECT_PATH="transfer-tests/nexora/${EXPECTED_SHA256:0:2}/${EXPECTED_SHA256}"
          git show "origin/tradix-transfer-test:${OBJECT_PATH}" > "$RUNNER_TEMP/NEXORA-0.5.4-source-package.zip"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/NEXORA-0.5.4-source-package.zip" | sha256sum --check -
          unzip -t "$RUNNER_TEMP/NEXORA-0.5.4-source-package.zip" >/dev/null

      - name: Extract and validate untrusted source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexora-source"
          unzip -q "$RUNNER_TEMP/NEXORA-0.5.4-source-package.zip" -d "$RUNNER_TEMP/nexora-source"
          APP="$RUNNER_TEMP/nexora-source/projects/NEXORA/app"
          test "$(cat "$APP/VERSION")" = "0.5.4"
          test -f "$APP/index.html"
          test -f "$APP/app.js"
          test -f "$APP/styles.css"
          test -f "$APP/manifest.webmanifest"
          test -f "$APP/tests/nexora-smoke.test.cjs"
          if unzip -Z1 "$RUNNER_TEMP/NEXORA-0.5.4-source-package.zip" | grep -q '^projects/NEXORA/assets/brand/'; then
            echo 'The source archive must not contain duplicate NEXORA brand masters.'
            exit 1
          fi
          node --test "$APP/tests/nexora-smoke.test.cjs"

      - name: Publish validated archive as a short-lived workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-nexora-0.5.4-source
          path: ${{ runner.temp }}/NEXORA-0.5.4-source-package.zip
          if-no-files-found: error
          retention-days: 1

  commit-to-staging:
    needs: validate-source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the non-production destination branch
        uses: actions/checkout@v4
        with:
          ref: tradix-transfer-test
          fetch-depth: 0

      - name: Download validated archive
        uses: actions/download-artifact@v4
        with:
          name: verified-nexora-0.5.4-source
          path: ${{ runner.temp }}/verified

      - name: Re-verify and commit without executing archive code
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA256='83b2b5fc464a5df1b5f1f8ef74b187962efdae0591a82ea28690a09eaa0a1f8e'
          ARCHIVE="$RUNNER_TEMP/verified/NEXORA-0.5.4-source-package.zip"
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum --check -
          unzip -t "$ARCHIVE" >/dev/null
          if [ -e projects/NEXORA/app ]; then
            echo 'projects/NEXORA/app already exists; refusing to overwrite existing application source.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nexora-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/nexora-source"
          APP="$RUNNER_TEMP/nexora-source/projects/NEXORA/app"
          test "$(cat "$APP/VERSION")" = "0.5.4"
          test -f projects/NEXORA/assets/brand/NEXORA-Official-Logo.png
          if unzip -Z1 "$ARCHIVE" | grep -q '^projects/NEXORA/assets/brand/'; then
            echo 'The source archive must not contain duplicate NEXORA brand masters.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nexora-source/projects/NEXORA/assets/brand"
          cp projects/NEXORA/assets/brand/NEXORA-Official-Logo.png "$RUNNER_TEMP/nexora-source/projects/NEXORA/assets/brand/"
          mkdir -p projects/NEXORA
          cp -an "$RUNNER_TEMP/nexora-source/projects/NEXORA/." projects/NEXORA/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/NEXORA
          git diff --cached --quiet && { echo 'No source changes to commit.'; exit 1; }
          git commit -m 'feat: import verified NEXORA 0.5.4 app source'
          git push origin HEAD:refs/heads/tradix-transfer-test
